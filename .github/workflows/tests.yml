name: Tests

# Historia #27: corre las pruebas en cada Pull Request (y en main) para ver pass/fail antes de hacer merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# issues: read -> el generador lee los bugs (label «bug») para la hoja «Bug report».
permissions:
  contents: read
  issues: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependencias del sistema (Tkinter + pantalla virtual)
        run: sudo apt-get update && sudo apt-get install -y xvfb tk

      - name: Instalar requirements
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pytest con cobertura
        run: |
          mkdir -p reports
          xvfb-run -a pytest \
            --cov=mis_trapitos --cov-report=term-missing \
            --cov-report=json:reports/coverage.json \
            --junitxml=reports/junit.xml

      # El mismo artefacto que consume el colector de métricas (Grafana): coverage.json + junit.xml
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/coverage.json
            reports/junit.xml
            reports/results.json
          if-no-files-found: warn

      - name: Generar SW Test Plan, TC Design y Test Report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generar_documentos.py

      - name: Publicar entregables (Excel + diagramas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entregables-qa
          path: entregables/
          if-no-files-found: warn

  # Deja los Excel de la última corrida en main en el release «qa-latest», con enlaces fijos:
  # https://github.com/<repo>/releases/download/qa-latest/<archivo>. Corre aunque fallen pruebas.
  publicar-entregables:
    needs: pytest
    if: always() && needs.pytest.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: entregables-qa
          path: entregables

      - name: Actualizar release qa-latest
        run: |
          (cd entregables && zip -qr ../entregables-qa.zip .)
          notas="Excel de QA generados por CI a partir de ${GITHUB_SHA::7} (corrida #${{ github.run_number }}, $(date -u +'%Y-%m-%d %H:%M UTC')).
          Se reemplazan en cada push a main. Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh release view qa-latest >/dev/null 2>&1; then
            gh release edit qa-latest --notes "$notas"
          else
            gh release create qa-latest --target "$GITHUB_SHA" --title "Entregables QA (último main)" --notes "$notas"
          fi
          gh release upload qa-latest entregables/*.xlsx entregables-qa.zip --clobber
