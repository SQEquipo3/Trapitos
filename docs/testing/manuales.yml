# TC manuales: los ejecuta una persona (el cliente en aceptación) o dependen de varias máquinas.
# Al ejecutarlo, llena manual_result (PASSED o FAILED), executed_by y executed_on (AAAA-MM-DD).
# Si no se puede ejecutar por un bug, blocked_by: "#<número del issue con label bug>".
# Los TC automatizados NO van aquí: viven en tests/ con el decorador @tc (ver tests/tc.py).
# Escribe los pasos como instrucciones que alguien nuevo pueda seguir sin preguntar: qué pantalla,
# qué botón, qué datos, y qué función del código se ejecuta detrás cuando ayuda a ubicarla.
- id: ATS_INS_01
  level: ATS
  module: interfaz
  name: Instalación y arranque en equipo limpio sin internet
  reqs:
  - RNF-01
  objective: >-
    Comprobar que la tienda puede instalar y usar la aplicación en un equipo sin conexión a internet,
    como será en el mostrador. Se instalan las dependencias de requirements.txt (Pillow) desde una
    carpeta local de paquetes (wheelhouse) y se arranca con main.py, que crea App (mis_trapitos/ui/app.py)
    y la base mis_trapitos.db con create_schema() de mis_trapitos/data/schema.py.
  pre: >-
    Equipo con Windows 10/11 o Ubuntu 22.04 y Python 3.12 con Tkinter, sin el proyecto instalado. En otro
    equipo con internet se preparó la carpeta de paquetes con «pip download -r requirements.txt -d wheelhouse»
    y se copió junto con el repositorio en una USB. El equipo de prueba se desconecta de la red.
  steps:
  - Copiar el repositorio y la carpeta wheelhouse al equipo de prueba.
  - Crear un entorno virtual (python -m venv .venv) y activarlo.
  - Instalar sin internet con pip install --no-index --find-links wheelhouse -r requirements.txt.
  - Ejecutar python main.py desde la raíz del repositorio.
  - Iniciar sesión con el usuario de ejemplo admin / 1234 (lo crea seed_examples() de mis_trapitos/data/seed.py).
  - Abrir la pantalla Productos y la pantalla Ventas.
  expected:
  - La instalación termina sin intentar descargar nada y sin errores.
  - Se abre la ventana de login y se crea el archivo mis_trapitos.db en la carpeta del proyecto.
  - El login entra a la ventana principal con las 7 pestañas de módulos.
  - Productos muestra el inventario de ejemplo y Ventas permite capturar un carrito.
  comments: >-
    Si falla la instalación, anotar el paquete que pidió internet. Relacionado con la brecha B-08 del
    SDD (dependencias sin versiones fijas).

- id: ATS_UX_01
  level: ATS
  module: interfaz
  name: Recorrido de usabilidad con la dueña de la tienda
  reqs:
  - RF-06
  - RF-01
  objective: >-
    Comprobar que una persona no técnica (la dueña de la tienda) puede hacer las dos tareas más comunes
    sin ayuda: dar de alta un producto en la pantalla Productos (ProductosUI.add_product_ui()) y registrar
    una venta con promoción en la pantalla Ventas (VentasUI.add_cart_item() y register_sale_ui()).
  pre: >-
    Aplicación instalada con los datos de ejemplo y sesión iniciada. Antes de empezar, quien observa crea
    en Promociones una promoción vigente del 20 % para un producto con existencias. Se tiene cronómetro y
    una hoja para anotar. Quien observa no explica la pantalla ni contesta cómo hacer las cosas.
  steps:
  - Pedirle que registre una blusa nueva (código, nombre, categoría, talla, color, precios y 5 piezas) y la guarde.
  - Pedirle que venda dos prendas, una de ellas la que tiene promoción, pagando con tarjeta de débito.
  - Medir el tiempo de cada tarea desde que se le pide hasta que la aplicación confirma.
  - Anotar cada duda, cada clic equivocado y cada mensaje de error que vea.
  - Al final preguntarle qué fue lo más confuso.
  expected:
  - El producto aparece en la tabla de inventario con 5 piezas.
  - El carrito muestra el porcentaje de la promoción en la línea del producto, la venta se registra con su ticket y el stock baja.
  - Completa ambas tareas sin asistencia en menos de 5 minutos en total.
  comments: >-
    Las dudas y errores anotados se registran como issues (mejora o bug) aunque el TC pase.

- id: ATS_SEG_01
  level: ATS
  module: interfaz
  name: Permisos por rol de empleado (brecha B-04)
  reqs:
  - SEG-01
  blocked_by: '#57'
  objective: >-
    Comprobar que un empleado con rol Vendedor no puede administrar empleados (crear, editar ni borrar
    usuarios). Hoy el rol se guarda en employees.role con empleados_repo.guardar(), pero App
    (mis_trapitos/ui/app.py) crea las mismas pestañas para cualquier rol: no hay autorización efectiva.
  pre: >-
    Aplicación instalada. En Contactos y usuarios → Empleados existen un usuario con rol Administrador y
    otro con rol Vendedor, ambos con contraseña conocida.
  steps:
  - Iniciar sesión con el usuario Vendedor.
  - Abrir el módulo Contactos y usuarios y la pestaña Empleados.
  - Intentar crear un empleado nuevo con el botón Guardar empleado.
  - Intentar editar el rol del propio Vendedor a Administrador.
  expected:
  - La pestaña Empleados no está disponible para el Vendedor, o muestra «Acceso denegado».
  - No se crea ni se modifica ningún empleado.
  comments: >-
    Bloqueado por la brecha B-04 del SDD (issue #57): el rol todavía no tiene autorización efectiva. Al
    implementarse, se puede automatizar con una prueba como las de tests/test_login.py.

- id: ATS_VD_08
  level: ATS
  module: productos
  name: VD-08 Consistencia de inventario entre dos terminales (LAN)
  reqs:
  - RNF-01
  blocked_by: '#56'
  objective: >-
    Escenario VD-08 del SDD: una venta hecha en la terminal A debe verse en la terminal B en 5 segundos o
    menos, para que dos vendedoras no vendan una prenda que ya no existe. Depende del servicio LAN
    descrito en docs/SAD.md, que aún no existe: hoy cada instancia abre su propia mis_trapitos.db.
  pre: >-
    Dos equipos en la misma red local con la aplicación instalada y conectados al mismo servicio de datos
    (brecha B-01: aún sin servicio LAN). Un producto con stock 5 visible en ambos.
  steps:
  - En A y en B abrir la pantalla Productos y ubicar el producto.
  - En A registrar una venta de 1 pieza desde la pantalla Ventas.
  - Con cronómetro, medir el tiempo hasta que B muestra stock 4 sin que nadie toque B.
  expected:
  - B muestra el stock 4 en 5 segundos o menos.
  comments: >-
    Bloqueado por la brecha B-01 del SDD (issue #56): hoy no existe sincronización entre instancias.

- id: ATS_VD_09
  level: ATS
  module: ventas
  name: VD-09 Dos ventas simultáneas del último artículo
  reqs:
  - RNF-01
  - RF-04
  blocked_by: '#56'
  objective: >-
    Escenario VD-09 del SDD: si dos terminales intentan vender al mismo tiempo la última pieza de un
    producto, solo una venta debe concretarse. En una sola terminal esto lo garantiza la revisión de
    stock dentro de la transacción de ventas.registrar() (mis_trapitos/services/ventas.py); entre
    terminales hace falta el servicio LAN.
  pre: >-
    Dos terminales A y B conectadas al mismo servicio de datos (brecha B-01) y un producto con stock 1.
  steps:
  - En A y en B agregar el producto al carrito en la pantalla Ventas.
  - Pulsar Registrar venta en ambas terminales casi al mismo tiempo (cuenta regresiva en voz alta).
  - Revisar el mensaje que aparece en cada terminal y el stock final.
  expected:
  - Una terminal registra la venta y el stock queda en 0.
  - La otra muestra «Stock insuficiente» y no guarda nada.
  comments: >-
    Requiere dos instancias conectadas (B-01, issue #56).
