# TC manuales: los ejecuta una persona (el cliente en aceptación) o dependen de varias máquinas.
# Al ejecutarlo, llena manual_result (PASSED o FAILED), executed_by y executed_on (AAAA-MM-DD).
# Si no se puede ejecutar por un bug, blocked_by: "#<número del issue con label bug>".
# Los TC automatizados NO van aquí: viven en tests/ con el decorador @tc (ver tests/tc.py).
- id: ATS_INS_01
  level: ATS
  module: interfaz
  name: Instalación y arranque en equipo limpio sin internet
  reqs:
  - RNF-01
  objective: La aplicación se instala desde requirements.txt y arranca en un equipo sin conexión.
  pre: Equipo limpio con Python 3.12 y Tkinter; copia descartable del código sin BD previa y wheelhouse preparado para el mismo sistema y arquitectura. Ver ACEPTACION_MANUAL.md.
  steps:
  - Registrar versión del código, sistema operativo y Python; desconectar el acceso a internet
  - Crear un entorno virtual e instalar requirements.txt con --no-index desde el wheelhouse local
  - Verificar dependencias con pip check y disponibilidad de Tkinter
  - Ejecutar python main.py con el Python del entorno virtual desde la copia descartable
  - Iniciar sesión con la cuenta de demostración y abrir Productos
  - Cerrar y volver a abrir la aplicación, manteniendo el equipo sin internet
  expected:
  - Instalación sin descargas de internet ni dependencias faltantes
  - Inicio de sesión y pantalla Productos operativos en ambos arranques
  - La BD se crea en la copia de prueba, sin usar datos de operación
  comments: 'Pendiente de ejecución en equipo limpio. El arranque normal carga ejemplos; no acredita load_examples=False. Conservar versión, registro de instalación y evidencia según ACEPTACION_MANUAL.md.'

- id: ATS_UX_01
  level: ATS
  module: interfaz
  name: Recorrido de usabilidad con la dueña de la tienda
  reqs:
  - RF-06
  - RF-01
  objective: Una persona no técnica registra un producto y una venta sin ayuda.
  pre: Copia descartable, cliente identificado y sesión iniciada. Preparar ACEP-PROMO-01 con precio 200, stock 10 y promoción vigente de 25%; código ACEP-NUEVO-01 aún inexistente. Ver ACEPTACION_MANUAL.md.
  steps:
  - Entregar al cliente la tarjeta de tareas e iniciar el cronómetro antes de su primera acción
  - Pedir que registre ACEP-NUEVO-01 con los datos de la tarjeta
  - Pedir que venda dos unidades de ACEP-PROMO-01 en efectivo, sin descuento general
  - Detener el cronómetro al mostrarse el ticket; registrar dudas, errores y cualquier asistencia
  - Comprobar el producto nuevo, el ticket y el stock final
  expected:
  - Completa ambas tareas sin asistencia en menos de 300 segundos
  - ACEP-NUEVO-01 queda registrado con stock 5
  - La venta aplica 25% de promoción y totaliza 300; ACEP-PROMO-01 queda con stock 8
  comments: 'Pendiente de ejecución con el cliente (#60). Guardar duración, asistencia y evidencias; las pruebas automatizadas no sustituyen este recorrido.'

- id: ATS_SEG_01
  level: ATS
  module: interfaz
  name: Permisos por rol de empleado (brecha B-04)
  reqs:
  - SEG-01
  blocked_by: '#57'
  objective: Un empleado con rol Vendedor no debe poder administrar empleados.
  pre: Usuarios Administrador y Vendedor.
  steps:
  - Entrar como Vendedor
  - Intentar abrir la gestión de empleados
  expected:
  - Acceso denegado
  comments: 'Brecha B-04: el rol aún no tiene autorización efectiva.'

- id: ATS_VD_08
  level: ATS
  module: productos
  name: VD-08 Consistencia de inventario entre dos terminales (LAN)
  reqs:
  - RNF-01
  blocked_by: '#56'
  objective: Verificar que una venta en la terminal A se refleja en la terminal B en ≤ 5 s.
  pre: Corrección #56 disponible y verificada; dos terminales en la misma LAN conectadas al mismo servicio y datos de prueba. Producto ACEP-LAN-01 con stock 10 en ambas. Ver ACEPTACION_MANUAL.md.
  steps:
  - Identificar la versión y las terminales A y B; comprobar stock 10 en ambas
  - Mantener abierto el inventario de B y vender una unidad de ACEP-LAN-01 en A
  - Medir desde la confirmación de venta hasta que B muestra el stock nuevo, sin recarga manual
  - Registrar duración y stock de ambas terminales
  expected:
  - Ambas terminales muestran stock 9; B se actualiza en un máximo de 5 segundos
  comments: 'Bloqueado por #56. No simular la sincronización copiando archivos SQLite; conservar evidencia de ambas terminales cuando el servicio LAN esté disponible.'

- id: ATS_VD_09
  level: ATS
  module: ventas
  name: VD-09 Dos ventas simultáneas del último artículo
  reqs:
  - RNF-01
  - RF-04
  blocked_by: '#56'
  objective: Solo una de dos ventas simultáneas del último artículo debe concretarse.
  pre: Corrección #56 disponible y verificada; dos terminales conectadas al mismo servicio y datos de prueba. Producto ACEP-ULTIMO-01 con stock 1 y sin ventas previas de ese producto.
  steps:
  - Agregar una unidad de ACEP-ULTIMO-01 al carrito de A y al de B antes de confirmar
  - Confirmar las dos ventas a una señal acordada y registrar las respuestas
  - Revisar tickets, ventas registradas, movimiento de salida y stock final
  expected:
  - Una venta se registra y la otra se rechaza por stock insuficiente
  - Solo se descuenta una unidad; el stock final es 0 en ambas terminales y nunca es negativo
  comments: 'Bloqueado por #56. Registrar qué terminal concretó la venta y la evidencia de la otra respuesta; ver ACEPTACION_MANUAL.md.'
