name: Conciliación stock = suma de movimientos
reqs:
- RNF-01
- RF-04
tests:
- tests/test_inventario.py::test_stock_es_suma_de_movimientos
objective: Tras venta, devolución y ajuste, el stock visible coincide con el kardex.
