id: ITS_VEN_02
level: ITS
module: ventas
name: 'Atomicidad: si una partida falla no se guarda nada'
reqs:
- RF-04
tests:
- tests/test_ventas.py::test_venta_es_atomica_si_falla_un_producto
- tests/test_ventas.py::test_venta_se_revierte_si_falla_una_escritura
objective: La venta se revierte completa ante stock insuficiente en la segunda partida o si falla
  una escritura a la mitad de la transacción.
pre: 'Dos productos: stock 5 y stock 1.'
steps:
- Vender 2 del primero y 9 del segundo
- Vender 2 piezas simulando un error al guardar la partida
expected:
- ValueError
- Stock del primero sigue en 5 y no existe venta
- El error se propaga, el stock sigue en 5 y no existe venta
