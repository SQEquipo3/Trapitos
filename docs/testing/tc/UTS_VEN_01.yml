id: UTS_VEN_01
level: UTS
module: ventas
name: Venta sin productos, producto inexistente o cantidad no positiva
reqs:
- RF-06
tests:
- tests/test_ventas.py::test_venta_vacia_es_rechazada
- tests/test_ventas.py::test_producto_inexistente_en_carrito_es_rechazado
- tests/test_ventas.py::test_cantidad_no_positiva_es_rechazada
objective: Validar las entradas de register_sale antes de escribir en la base.
pre: Un empleado y un producto con stock registrados.
steps:
- Registrar venta con carrito vacío
- Registrar venta con id de producto inexistente
- Registrar venta con cantidad 0 y -2
expected:
- ValueError 'La venta no tiene productos'
- ValueError 'Producto no encontrado'
- ValueError 'La cantidad debe ser mayor a cero'
