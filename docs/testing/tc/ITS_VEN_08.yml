id: ITS_VEN_08
level: ITS
module: ventas
name: Cancelación con líneas duplicadas por producto (brecha B-03)
reqs:
- RF-05
tests:
- tests/test_ventas.py::test_cancelacion_con_lineas_duplicadas_repone_el_remanente_exacto
objective: Confirmar que la cancelación repone el remanente exacto cuando el carrito trae el mismo producto en dos
  líneas.
pre: Producto stock 20; venta con líneas 2 y 3 del mismo producto; devolución de 2.
steps:
- Cancelar la venta
- Comparar stock final con 20
expected:
- Stock final = 20
comments: 'DEFECTO ABIERTO B-03 (SDD §11): la cancelación calcula el remanente por línea y descuenta las devoluciones
  dos veces. La prueba está marcada xfail(strict) y se reporta como FAILED.'
