id: UTS_PRO_02
level: UTS
module: productos
name: Código de producto duplicado es rechazado
reqs:
- RF-01
tests:
- tests/test_inventario.py::test_codigo_duplicado_es_rechazado
objective: Garantizar la unicidad del código de producto (restricción UNIQUE).
pre: Existe un producto con código DUP.
